services:
  futbolleague.api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futbolleague_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=host.docker.internal;Port=5432;Database=FutbolLeagueDB;Username=postgres;Password=1234